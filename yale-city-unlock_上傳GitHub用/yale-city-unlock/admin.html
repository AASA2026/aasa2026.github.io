<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>預約管理後台｜Yale 城市解鎖計畫</title>
<link rel="icon" href="yale-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#FFD800;--water:#A8D3E6;--green:#B9DAA5;--soft:#6f6967;--line:3px solid var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:44px;height:44px;border:var(--line);border-radius:50%}
.top h1{font-size:22px;font-weight:400;margin:0;flex:1}
.btn{font:inherit;color:var(--ink);background:#fff;border:var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.btn.y{background:var(--yellow)}.btn.c{background:var(--coral)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:var(--line);border-radius:24px;padding:18px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:var(--line);border-radius:18px;padding:12px 14px}
.stat .k{font-size:13px;color:var(--soft)}.stat .v{font-size:28px;line-height:1.2}
.s1{background:var(--yellow)}.s2{background:var(--water)}.s3{background:var(--green)}.s4{background:#fde4df}
.slotbar{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:4px}
.sb{border:2px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center;font-size:13px;line-height:1.3}
.sb b{display:block;font-weight:400;font-size:15px}
.sb.full{background:var(--coral)}.sb.half{background:#fff3a8}
@media (max-width:700px){.slotbar{grid-template-columns:repeat(4,1fr)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tools input[type=search]{font:inherit;border:var(--line);border-radius:999px;padding:6px 14px;background:var(--paper);min-width:200px;flex:1;max-width:300px}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:2px solid #eee6dd;white-space:nowrap}
th{font-weight:400;color:var(--soft);font-size:13px;border-bottom:3px solid var(--ink)}
tr.cancelled td{color:#b3aca8;text-decoration:line-through}
tr.cancelled td.act{text-decoration:none}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px}
.tag.ok{background:var(--green)}.tag.fail{background:var(--coral)}.tag.pending{background:#fff}
.mini{font:inherit;font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.login{max-width:380px;margin:60px auto 0;text-align:center}
.login input{display:block;width:100%;font:inherit;border:var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;background:var(--paper)}
.login .btn{width:100%;margin-top:14px;padding:10px}
.msg{color:#c2412d;margin-top:10px;min-height:1.6em}
.demo{background:var(--ink);color:var(--paper);text-align:center;font-size:13px;padding:6px}
.hidden{display:none !important}
.empty{text-align:center;color:var(--soft);padding:24px}
</style>
</head>
<body>
<div class="demo hidden" id="demoBar">展示模式：尚未連接 Firebase，以下為範例資料</div>
<div class="wrap">
  <div class="top">
    <img src="yale-logo.png" alt="Yale">
    <h1>城市解鎖計畫｜預約管理後台</h1>
    <span id="who" class="hidden" style="font-size:13px;color:#6f6967"></span>
    <button class="btn hidden" id="logoutBtn">登出</button>
  </div>

  <div id="loginView" class="card login hidden">
    <h2 style="font-weight:400;margin:0 0 4px">管理員登入</h2>
    <div style="font-size:13px;color:#6f6967">帳號需先由專案管理者加入管理員名單</div>
    <input type="email" id="lEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="lPass" placeholder="密碼" autocomplete="current-password">
    <button class="btn y" id="loginBtn">登入</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="mainView" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat s1"><div class="k">已預約組數</div><div class="v"><span id="stGroups">0</span> / 32</div></div>
        <div class="stat s2"><div class="k">預計到場人數</div><div class="v" id="stPeople">0</div></div>
        <div class="stat s3"><div class="k">剩餘名額</div><div class="v" id="stLeft">32</div></div>
        <div class="stat s4"><div class="k">確認信寄送失敗</div><div class="v" id="stFail">0</div></div>
      </div>
      <div style="margin:16px 0 6px;color:#6f6967;font-size:13px">各時段預約狀況（組數／2）</div>
      <div class="slotbar" id="slotbar"></div>
    </div>

    <div class="card">
      <div class="tools">
        <input type="search" id="q" placeholder="搜尋姓名、編號、電話末三碼">
        <label><input type="checkbox" id="showFull">顯示完整電話</label>
        <label><input type="checkbox" id="showCancelled">顯示已取消</label>
        <span style="flex:1"></span>
        <button class="btn y" id="exportBtn">匯出 Excel（現場核對用）</button>
      </div>
      <div class="tablebox">
        <table>
          <thead><tr><th>時段</th><th>預約編號</th><th>姓名</th><th>電話</th><th>人數</th><th>Email</th><th>確認信</th><th>預約時間</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div style="font-size:13px;color:#6f6967;margin-top:10px">匯出的 Excel 電話只顯示末三碼，依時段排序，並附「報到」空白欄可列印勾選。取消預約後名額會自動釋出。</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const cfg = window.FIREBASE_CONFIG || {};
  const DEMO = !cfg.apiKey || cfg.apiKey === "請貼上";
  const $ = id => document.getElementById(id);
  const SLOTS = [];
  for (let i = 0; i < 16; i++) {
    const s = 12*60+30 + i*15, e = s+15, f = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    SLOTS.push({ id: f(s).replace(":",""), label: f(s)+"–"+f(e), start: f(s) });
  }
  const mask = p => p ? "*".repeat(Math.max(0, p.length-3)) + p.slice(-3) : "";
  const fmtPhone = p => p && p.length === 10 ? p.slice(0,4)+"-"+p.slice(4,7)+"-"+p.slice(7) : p;
  const fmtTime = t => { if (!t) return ""; const d = t.toDate ? t.toDate() : new Date(t);
    return d.toLocaleString("zh-TW",{ timeZone:"Asia/Taipei", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false }); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let bookings = [], cancelFn = null;

  function sorted(list){ return list.slice().sort((a,b) => (a.slotOrder-b.slotOrder) || ((a.createdAtMs||0)-(b.createdAtMs||0))); }
  function render(){
    const active = bookings.filter(b => b.status !== "cancelled");
    $("stGroups").textContent = active.length;
    $("stPeople").textContent = active.reduce((n,b) => n + (b.partySize||0), 0);
    $("stLeft").textContent = 32 - active.length;
    $("stFail").textContent = active.filter(b => b.emailStatus === "failed").length;
    $("slotbar").innerHTML = SLOTS.map(s => { const n = active.filter(b => b.slotId === s.id).length;
      return `<div class="sb ${n>=2?"full":n===1?"half":""}"><b>${s.start}</b>${n} / 2</div>`; }).join("");

    const q = $("q").value.trim().toLowerCase(), full = $("showFull").checked, showC = $("showCancelled").checked;
    const list = sorted(bookings).filter(b => (showC || b.status !== "cancelled") &&
      (!q || [b.name, b.bookingNo, (b.phone||"").slice(-3), b.email].some(x => String(x||"").toLowerCase().includes(q))));
    const mailTag = b => b.emailStatus === "sent" ? '<span class="tag ok">已寄出</span>' : b.emailStatus === "failed" ? `<span class="tag fail" title="${esc(b.emailError)}">失敗</span>` : '<span class="tag pending">處理中</span>';
    $("rows").innerHTML = list.length ? list.map(b => `<tr class="${b.status==="cancelled"?"cancelled":""}">
      <td>${esc(b.slotLabel)}</td><td>${esc(b.bookingNo)}</td><td>${esc(b.name)}</td>
      <td>${esc(full ? fmtPhone(b.phone) : mask(b.phone))}</td><td>${b.partySize} 人</td><td>${esc(b.email)}</td>
      <td>${mailTag(b)}</td><td>${fmtTime(b.createdAt)}</td>
      <td class="act">${b.status==="cancelled" ? '<span class="tag">已取消</span>' : `<button class="mini" data-cancel="${esc(b.bookingNo)}">取消預約</button>`}</td></tr>`).join("")
      : '<tr><td colspan="9" class="empty">目前沒有預約資料</td></tr>';
    document.querySelectorAll("[data-cancel]").forEach(btn => btn.onclick = () => doCancel(btn.dataset.cancel, btn));
  }
  ["q","showFull","showCancelled"].forEach(id => $(id).addEventListener("input", render));

  async function doCancel(no, btn){
    const b = bookings.find(x => x.bookingNo === no);
    if (!window.confirm(`確定要取消 ${no}（${b.name}，${b.slotLabel}）？\n取消後名額會釋出，此手機可重新預約。`)) return;
    btn.disabled = true; btn.textContent = "處理中…";
    try { await cancelFn(no); } catch(e){ alert("取消失敗：" + (e.message||e)); btn.disabled = false; btn.textContent = "取消預約"; }
  }

  $("exportBtn").onclick = () => {
    const rows = sorted(bookings.filter(b => b.status !== "cancelled")).map(b => ({
      "時段": b.slotLabel, "預約編號": b.bookingNo, "姓名": b.name, "電話（末三碼）": mask(b.phone),
      "人數": b.partySize, "預約時間": fmtTime(b.createdAt), "報到": ""
    }));
    const ws = XLSX.utils.json_to_sheet(rows, { header: ["時段","預約編號","姓名","電話（末三碼）","人數","預約時間","報到"] });
    ws["!cols"] = [{wch:14},{wch:10},{wch:14},{wch:14},{wch:6},{wch:14},{wch:8}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "預約名單");
    const d = new Date(), stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
    XLSX.writeFile(wb, `Yale城市解鎖計畫_預約名單_${stamp}.xlsx`);
  };

  function showMain(email){
    $("loginView").classList.add("hidden"); $("mainView").classList.remove("hidden");
    $("who").textContent = email; $("who").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden");
  }

  if (DEMO) {
    $("demoBar").classList.remove("hidden");
    const names = ["王小美","陳大文","林怡君","張志明","李佳穎","黃冠宇","吳欣怡","蔡承翰","劉雅婷","鄭宇軒"];
    const picks = ["1230","1230","1245","1245","1300","1400","1400","1430","1545","1615"];
    bookings = picks.map((sid,i) => { const s = SLOTS.find(x => x.id === sid);
      return { bookingNo:"YL"+String(i+1).padStart(3,"0"), name:names[i], phone:"09"+String(12345678+i*1111111).slice(0,8), email:`guest${i+1}@example.com`,
        slotId:sid, slotLabel:s.label, slotOrder:SLOTS.indexOf(s), partySize:(i%3===0?1:2), status:"booked",
        emailStatus: i===6 ? "failed" : "sent", emailError:"範例", createdAt:new Date(Date.UTC(2026,10,3+i%9,3+i,10*i%60)), createdAtMs:i }; });
    cancelFn = async no => { const b = bookings.find(x => x.bookingNo === no); b.status = "cancelled"; render(); };
    showMain("demo@yale.com"); render();
    return;
  }

  (async () => {
    const V = "10.12.2";
    const [{ initializeApp }, au, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const app = initializeApp(cfg), auth = au.getAuth(app), db = fs.getFirestore(app);
    // 取消預約：預約標記取消、時段名額 -1、釋放手機號碼（同一批次寫入）
    cancelFn = async no => {
      const b = bookings.find(x => x.bookingNo === no);
      if (!b || b.status === "cancelled") return;
      const batch = fs.writeBatch(db);
      batch.update(fs.doc(db, "cityunlock_bookings", no), { status: "cancelled", cancelledAt: fs.serverTimestamp(), cancelledBy: auth.currentUser.email });
      batch.update(fs.doc(db, "cityunlock_slots", b.slotId), { count: fs.increment(-1) });
      batch.delete(fs.doc(db, "cityunlock_phones", b.phone));
      await batch.commit();
    };
    let unsub = null;

    $("loginBtn").onclick = async () => {
      $("loginMsg").textContent = "";
      try { await au.signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value); }
      catch(e){ $("loginMsg").textContent = "登入失敗，請確認帳號密碼"; }
    };
    $("lPass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
    $("logoutBtn").onclick = () => au.signOut(auth);

    au.onAuthStateChanged(auth, async user => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { $("mainView").classList.add("hidden"); $("loginView").classList.remove("hidden");
        $("who").classList.add("hidden"); $("logoutBtn").classList.add("hidden"); return; }
      const ok = await fs.getDoc(fs.doc(db, "cityunlock_admins", user.email.toLowerCase())).then(s => s.exists()).catch(() => false);
      if (!ok) { $("loginMsg").textContent = "此帳號不在管理員名單中"; await au.signOut(auth); return; }
      showMain(user.email);
      unsub = fs.onSnapshot(fs.collection(db, "cityunlock_bookings"), snap => {
        bookings = snap.docs.map(d => { const x = d.data(); x.createdAtMs = x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0; return x; });
        render();
      }, e => { alert("讀取名單失敗：" + e.message); });
    });
  })().catch(e => { console.error(e); alert("系統連線失敗，請重新整理"); });
})();
</script>
</body>
</html>
